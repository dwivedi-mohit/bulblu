<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulblu Admin - Application Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4">
    <div class="flex items-center justify-between max-w-5xl mx-auto">
      <div class="flex items-center gap-3">
        <a href="/admin/dashboard.html" class="text-gray-400 hover:text-gray-600 transition">&larr; Back</a>
        <h1 class="text-xl font-bold text-gray-900">Application Detail</h1>
      </div>
      <button onclick="logout()" class="text-sm text-gray-500 hover:text-red-600 transition">Logout</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-6">
    <div id="content" class="text-center py-12 text-gray-500">Loading application...</div>
  </main>

  <script>
    function getToken() { return localStorage.getItem('adminToken'); }
    function logout() { localStorage.removeItem('adminToken'); window.location.href = '/admin/'; }
    function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` }; }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function statusColor(status) {
      switch (status) {
        case 'PENDING_VERIFICATION': return 'bg-amber-100 text-amber-700';
        case 'APPROVED': return 'bg-green-100 text-green-700';
        case 'REJECTED': return 'bg-red-100 text-red-600';
        default: return 'bg-gray-100 text-gray-600';
      }
    }

    async function loadApplication() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { window.location.href = '/admin/dashboard.html'; return; }

      try {
        const res = await fetch(`/api/admin/applications/${id}`, { headers: authHeaders() });
        if (res.status === 401 || res.status === 403) { logout(); return; }
        if (!res.ok) { document.getElementById('content').innerHTML = '<p class="text-red-500">Application not found</p>'; return; }

        const app = await res.json();
        document.title = `${app.display_name} - Bulblu Admin`;

        const gallery = (app.gallery_images || []).map(url =>
          `<img src="${escapeHtml(url)}" class="w-32 h-32 rounded-xl object-cover border border-gray-200" onerror="this.onerror=null;this.style.display='none';" />`
        ).join('');

        document.getElementById('content').innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left: Profile Summary -->
            <div class="lg:col-span-1 space-y-4">
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm text-center">
                <img
                  src="${escapeHtml(app.pfp_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300')}"
                  alt="${escapeHtml(app.display_name)}"
                  class="w-24 h-24 rounded-full mx-auto object-cover border-3 border-teal-500 mb-4"
                  onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300';"
                />
                <h2 class="text-xl font-bold text-gray-900">${escapeHtml(app.display_name)}</h2>
                <p class="text-sm text-gray-500">${escapeHtml(app.full_legal_name)}</p>
                <span class="inline-block mt-2 text-xs px-3 py-1 rounded-full font-semibold ${statusColor(app.status)}">${app.status?.replace('_', ' ')}</span>

                <div class="mt-4 space-y-2 text-sm text-left">
                  <div class="flex justify-between py-2 border-b border-gray-100">
                    <span class="text-gray-500">Email</span>
                    <span class="font-medium text-gray-900">${escapeHtml(app.email)}</span>
                  </div>
                  <div class="flex justify-between py-2 border-b border-gray-100">
                    <span class="text-gray-500">Phone</span>
                    <span class="font-medium text-gray-900">${escapeHtml(app.phone_number)}</span>
                  </div>
                  <div class="flex justify-between py-2 border-b border-gray-100">
                    <span class="text-gray-500">WhatsApp</span>
                    <span class="font-medium text-gray-900">${escapeHtml(app.whatsapp_number)}</span>
                  </div>
                  <div class="flex justify-between py-2 border-b border-gray-100">
                    <span class="text-gray-500">City</span>
                    <span class="font-medium text-gray-900">${escapeHtml(app.city || 'Mumbai')}</span>
                  </div>
                  <div class="flex justify-between py-2 border-b border-gray-100">
                    <span class="text-gray-500">Hourly Rate</span>
                    <span class="font-bold text-teal-600">$${parseFloat(app.hourly_rate) || 25}/hr</span>
                  </div>
                  <div class="flex justify-between py-2">
                    <span class="text-gray-500">Speed Call</span>
                    <span class="font-bold text-teal-600">$${parseFloat(app.speed_call_rate) || 5}/15min</span>
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              ${app.status === 'PENDING_VERIFICATION' ? `
                <div class="flex gap-3">
                  <button onclick="approveApp('${app.id}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl transition">
                    Approve
                  </button>
                  <button onclick="rejectApp('${app.id}')" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-xl transition">
                    Reject
                  </button>
                </div>
              ` : app.status === 'APPROVED' ? `
                <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
                  <p class="text-green-700 font-semibold">Approved</p>
                  <p class="text-sm text-green-600 mt-1">This companion is live on the platform</p>
                </div>
              ` : `
                <div class="bg-red-50 border border-red-200 rounded-xl p-4">
                  <p class="text-red-600 font-semibold">Rejected</p>
                  ${app.rejection_reason ? `<p class="text-sm text-red-500 mt-1">Reason: ${escapeHtml(app.rejection_reason)}</p>` : ''}
                </div>
              `}
            </div>

            <!-- Right: Details -->
            <div class="lg:col-span-2 space-y-4">
              <!-- Bio -->
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-900 mb-2">Bio</h3>
                <p class="text-gray-600">${escapeHtml(app.bio || 'No bio provided')}</p>
              </div>

              <!-- Identity Verification -->
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-900 mb-2">Identity Verification</h3>
                <div class="grid grid-cols-2 gap-4 text-sm">
                  <div>
                    <span class="text-gray-500">ID Type</span>
                    <p class="font-medium text-gray-900">${escapeHtml(app.govt_id_type)}</p>
                  </div>
                  <div>
                    <span class="text-gray-500">ID Number</span>
                    <p class="font-medium text-gray-900">${escapeHtml(app.govt_id_number)}</p>
                  </div>
                </div>
                ${app.live_selfie_url ? `
                  <div class="mt-4">
                    <span class="text-gray-500 text-sm">Live Selfie</span>
                    <img src="${escapeHtml(app.live_selfie_url)}" class="mt-2 w-32 h-32 rounded-xl object-cover border border-gray-200" onerror="this.onerror=null;this.style.display='none';" />
                  </div>
                ` : ''}
              </div>

              <!-- Services Offered -->
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-900 mb-2">Services Offered</h3>
                <div class="flex flex-wrap gap-2">
                  ${(app.services_offered || []).map(s => `
                    <span class="px-3 py-1 bg-teal-50 text-teal-700 text-sm rounded-full font-medium">${escapeHtml(s)}</span>
                  `).join('')}
                </div>
              </div>

              <!-- Portfolio Gallery -->
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-900 mb-2">Portfolio Photos (${(app.gallery_images || []).length})</h3>
                <div class="flex flex-wrap gap-3">
                  ${gallery || '<p class="text-gray-400 text-sm">No photos uploaded</p>'}
                </div>
              </div>

              <!-- Bank/UPI -->
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-900 mb-2">Bank / UPI Details</h3>
                <p class="font-mono text-gray-700 bg-gray-50 p-3 rounded-lg">${escapeHtml(app.bank_upi_id)}</p>
              </div>

              <!-- Code of Conduct -->
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                <h3 class="font-bold text-gray-900 mb-2">Code of Conduct</h3>
                <div class="flex items-center gap-2">
                  <span class="w-5 h-5 rounded-full ${app.signed_code_of_conduct ? 'bg-green-500' : 'bg-red-500'} flex items-center justify-center text-white text-xs">${app.signed_code_of_conduct ? '✓' : '✗'}</span>
                  <span class="text-sm text-gray-600">${app.signed_code_of_conduct ? 'Signed and agreed' : 'Not signed'}</span>
                </div>
              </div>

              <!-- Voice Intro -->
              ${app.voice_intro_url ? `
                <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                  <h3 class="font-bold text-gray-900 mb-2">Voice Intro</h3>
                  <audio controls class="w-full" src="${escapeHtml(app.voice_intro_url)}"></audio>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById('content').innerHTML = '<p class="text-red-500">Failed to load application</p>';
      }
    }

    async function approveApp(id) {
      if (!confirm('Approve this companion application? This will create their public profile.')) return;
      try {
        const res = await fetch(`/api/admin/applications/${id}/approve`, { method: 'PATCH', headers: authHeaders() });
        const data = await res.json();
        if (res.ok) { alert('Application approved!'); loadApplication(); }
        else { alert(data.error || 'Failed to approve'); }
      } catch (e) { alert('Network error'); }
    }

    async function rejectApp(id) {
      const reason = prompt('Rejection reason (optional):');
      if (reason === null) return;
      try {
        const res = await fetch(`/api/admin/applications/${id}/reject`, {
          method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ reason }),
        });
        const data = await res.json();
        if (res.ok) { alert('Application rejected'); loadApplication(); }
        else { alert(data.error || 'Failed to reject'); }
      } catch (e) { alert('Network error'); }
    }

    if (!getToken()) { window.location.href = '/admin/'; }
    else { loadApplication(); }
  </script>
</body>
</html>
